<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4facfe;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
        }

        .update-btn {
            background-color: #28a745;
        }

        .update-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        .add_btn{
            background-color: #4facfe;
        }
        .add_btn:hover{
            background: #00c6ff;
            transform: scale(1.05);
        }
        .remove-btn {
            background-color: #dc3545;
        }

        .remove-btn:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            th, td {
                padding: 8px;
                font-size: 14px;
            }

            img {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <h2>Confirm cart</h2>

    <div class="table-container">
        
        <table>
            <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Price (₹)</th>
                <th>Description</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
{% for d in data %}
            <tr>
                <td><img src="{{ url_for('static',filename='uploads/'+d[5]) }}"></td>
                <td>{{ d[1] }}</td>
                <td>{{ d[2] }}</td>
                <td>{{ d[4] }}</td>
                <td>{{ d[3] }}</td>
                <td><a href="/admin/update_product_page/{{ d[0] }}"><button class="btn update-btn">Update</button></a>
                    <a href="/admin/remove_product/{{ d[0] }}"><button class="btn remove-btn">Remove</button></a>
                    
                </td>
            </tr>
{% endfor %}
        </table>
    </div>

</body>
</html>
