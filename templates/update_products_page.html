{% extends 'admin_base.html' %}

{% block title %}Update Product - Admin Panel{% endblock %}

{% block content %}
<div class="center-container">
    <div class="glass-card" style="max-width: 600px;">
        <h2>Update Product ✏️</h2>
        
        <form action="/admin/update_product_page/{{ p[0] }}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="p_name" class="form-control" value="{{ p[1] }}" required>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" value="{{ p[2] }}" required>
            </div>

            <div class="form-group">
                <label>Purchasing Price (Cost ₹)</label>
                <input type="number" name="purchasing_price" class="form-control" value="{{ p[6] if p[6] else 0 }}" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" name="desc" class="form-control" value="{{ p[4] }}" required>
            </div>

            <div class="form-group">
                <label>Stock Count</label>
                <input type="number" name="stock" class="form-control" value="{{ p[3] }}" required>
            </div>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 1.5rem; background: rgba(0,0,0,0.02); padding: 1rem; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.05);">
                <img src="{{url_for('static',filename='uploads/'+ p[5])}}" style="height: 100px; width: 100px; object-fit: contain; background: white; border-radius: 8px;">
                <div style="flex: 1;">
                    <label>Upload New Image (Optional)</label>
                    <input type="file" name="image" class="form-control" style="padding: 8px;" title="Upload New Image?">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
