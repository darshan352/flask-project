{% extends 'admin_base.html' %}
{% block title %}Manage Admins{% endblock %}

{% block content %}
<div class="center-container" style="max-width: 1000px; margin: 0 auto; padding: 2rem;">
    <div class="glass-card">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 1rem;">
            <h2 style="margin: 0;">System Administrators</h2>
            <a href="/admin/add_admin" class="btn"
                style="background: var(--primary); color: rgb(0, 0, 0); padding: 0.5rem 1rem;">+ Add Admin</a>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                <thead>
                    <tr style="background: rgba(0,0,0,0.05); text-align: left;">
                        <th style="padding: 1rem; border-bottom: 2px solid rgba(0,0,0,0.1);">Admin ID</th>
                        <th style="padding: 1rem; border-bottom: 2px solid rgba(0,0,0,0.1);">Username</th>
                        <th style="padding: 1rem; border-bottom: 2px solid rgba(0,0,0,0.1); text-align: center;">Action
                        </th>
                    </tr>
                </thead>
                <tbody>
                    {% for admin in admins %}
                    <tr style="border-bottom: 1px solid rgba(0,0,0,0.05);">
                        <td style="padding: 1rem;">{{ admin[0] }}</td>
                        <td style="padding: 1rem; font-weight: 500;">{{ admin[1] }}</td>
                        <td
                            style="padding: 1rem; text-align: center; display: flex; gap: 0.5rem; justify-content: center;">
                            <a href="/admin/update_admin/{{ admin[0] }}" class="btn"
                                style="background: var(--primary); color: rgb(0, 0, 0); padding: 0.5rem 1rem; font-size: 0.9rem;">Edit</a>
                            <a href="/admin/remove_admin/{{ admin[0] }}" class="btn"
                                style="background: var(--danger); color: rgb(0, 0, 0); padding: 0.5rem 1rem; font-size: 0.9rem;"
                                onclick="return confirm('Are you sure you want to delete this admin account?');">Delete</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" style="padding: 2rem; text-align: center; color: var(--text-muted);">No admins
                            found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
