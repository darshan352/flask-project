{% extends 'base.html' %}

{% block title %}Buy Product - E-Shop{% endblock %}

{% block content %}
<div class="center-container" style="align-items: flex-start; padding-top: 2rem;">
    <div class="glass-card" style="max-width: 600px; width: 100%;">
        <div class="product-image-wrapper" style="border-radius: var(--radius-md); margin-bottom: 2rem;">
            <img src="{{ url_for('static', filename='uploads/' + product[5]) }}" alt="{{ product[1] }}">
        </div>

        <h2 style="text-align: left; margin-bottom: 0.5rem;">{{ product[1] }}</h2>
        
        <div class="product-price" style="font-size: 2rem; margin-bottom: 1rem;">₹{{ product[2] }}</div>
        
        <div class="product-stock" style="margin-bottom: 2rem; font-size: 1rem;">
            Available Stock: {{ product[3] }}
        </div>

        <form action="/user/buy_product/{{ product[0] }}" method="POST">
            <div class="form-group" style="background: rgba(99, 102, 241, 0.05); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(99, 102, 241, 0.1);">
                <label style="font-size: 1.1rem; color: var(--text-main);">Select Quantity</label>
                <input type="number" name="qty" id="qty" class="form-control" value="1" min="1" max="{{ product[3] }}" oninput="updateTotal()" style="max-width: 150px; font-size: 1.2rem;">
                
                <div id="totalPrice" style="margin-top: 1rem; font-size: 1.5rem; font-weight: 800; color: var(--secondary-color);">
                    Final Total: ₹{{ product[2] }}
                </div>
            </div>

            <div class="form-group" style="background: rgba(99, 102, 241, 0.05); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(99, 102, 241, 0.1); margin-top: 1.5rem;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-main);">Select Payment Method</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; padding: 10px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; transition: background 0.2s;">
                        <input type="radio" name="payment_method" value="COD" checked onchange="toggleUPI(false)" style="transform: scale(1.2);"> Cash on Delivery (COD)
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; padding: 10px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; transition: background 0.2s;">
                        <input type="radio" name="payment_method" value="UPI" onchange="toggleUPI(true)" style="transform: scale(1.2);"> UPI / Online Payment
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="button" class="btn btn-outline-nav btn-block" onclick="window.history.back()">Cancel</button>
                <button type="submit" id="submit-btn" class="btn btn-success btn-block">Confirm Purchase ✅</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const basePrice = parseFloat("{{ product[2] }}");

    function updateTotal() {
        let qty = parseInt(document.getElementById("qty").value) || 1;
        if(qty < 1) { qty = 1; document.getElementById("qty").value = 1; }
        let total = basePrice * qty;
        document.getElementById("totalPrice").innerHTML = "Final Total: ₹" + total;
        
        const isUPI = document.querySelector('input[name="payment_method"][value="UPI"]').checked;
        const btn = document.getElementById('submit-btn');
        if(isUPI) {
            btn.innerHTML = 'Pay ₹' + total + ' ⚡';
        } else {
            btn.innerHTML = 'Confirm Purchase ✅';
        }
    }

    function toggleUPI(show) {
        updateTotal();
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateTotal();
    });
</script>
{% endblock %}
