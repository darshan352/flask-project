{% extends 'base.html' %}

{% block title %}Update Profile - E-Shop{% endblock %}

{% block content %}
<div class="center-container">
    <div class="glass-card">
        <h2>Update Profile ⚙️</h2>

        {% if fix %}
        <form action="/user/update_profile" method="post">
            <div class="form-group">
                <label>Please enter your old password to verify your identity</label>
                <input type="password" name="old_password" class="form-control" required placeholder="Old Password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Verify Identity</button>
        </form>
        {% endif %}

        {% if show %}
        <form action="/user/update_profile/save_update" method="post" onsubmit="return confirm('Save updates to your profile?');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ data[2] }}" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group" style="position: relative;">
                <label>Password</label>
                <input type="password" name="password" id="pass" class="form-control" value="{{ password }}" placeholder="Enter new password" required>
                <button type="button" id="btn" onclick="toggle()" style="position: absolute; right: 15px; top: 40px; background: none; border: none; font-weight: bold; color: var(--primary-color); cursor: pointer;">Show</button>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <!-- Email is PK usually, changing it might break FK, keeping it readonly or just UI -->
                <input type="email" name="email" class="form-control" value="{{ data[1] }}" placeholder="Email" readonly style="background: #e2e8f0; cursor: not-allowed;">
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" value="{{ data[3] }}" placeholder="Phone number" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" name="add" class="form-control" value="{{ data[4] }}" placeholder="Address" required>
            </div>

            <div class="form-group">
                <label>Pincode</label>
                <input type="number" name="pincode" class="form-control" value="{{ data[5] }}" placeholder="Pincode" required>
            </div>

            <button type="submit" class="btn btn-success btn-block">Save Changes</button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggle() {
        let p = document.getElementById("pass");
        let b = document.getElementById("btn");

        if (p.type === "password") {
            p.type = "text";
            b.innerText = "Hide";
        } else {
            p.type = "password";
            b.innerText = "Show";
        }
    }
</script>
{% endblock %}
