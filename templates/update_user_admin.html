{% extends 'admin_base.html' %}
{% block title %}Update User - Admin Panel{% endblock %}

{% block content %}
<div class="center-container" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
    <div class="glass-card">
        <h2 style="margin-bottom: 2rem; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 1rem;">Update User: {{ user[1] }}</h2>
        <form action="/admin/update_user/{{ user[1] }}" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ user[2] }}" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ user[1] }}" disabled>
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Email cannot be changed.</small>
            </div>
            <div class="form-group">
                <label>New Password (leave blank to keep current)</label>
                <input type="text" name="password" class="form-control" placeholder="Enter new password">
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Current password is unchanged if left blank.</small>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="number" name="phone" class="form-control" value="{{ user[3] }}" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" class="form-control" rows="3" required>{{ user[4] }}</textarea>
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="number" name="pincode" class="form-control" value="{{ user[5] }}" required>
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update User</button>
                <a href="/admin/view_users" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
