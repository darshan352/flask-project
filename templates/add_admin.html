{% extends 'admin_base.html' %}
{% block title %}Add Admin - Admin Panel{% endblock %}

{% block content %}
<div class="center-container" style="max-width: 500px; margin: 0 auto; padding: 2rem;">
    <div class="glass-card">
        <h2 style="margin-bottom: 2rem; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 1rem;">Add New Administrator</h2>
        <form action="/admin/add_admin" method="POST">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" name="admin_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Add Admin</button>
                <a href="/admin/view_admins" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
