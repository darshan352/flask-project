{% extends 'base.html' %}

{% block title %}Sign Up - E-Shop{% endblock %}

{% block content %}
<div class="center-container">
    <div class="glass-card">
        <h2>Create an Account ✨</h2>
        
        <form action="/signup" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="user_name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="Enter your mobile number" required>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea name="address" class="form-control" placeholder="Your full address..." required style="resize: vertical; min-height: 80px;"></textarea>
            </div>

            <div class="form-group">
                <label>Pincode</label>
                <input type="number" name="pincode" class="form-control" placeholder="Zip / Pincode" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign Up Now</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login instead</a>
        </div>
    </div>
</div>
{% endblock %}
