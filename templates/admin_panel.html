{% extends 'admin_base.html' %}

{% block content %}
<div class="center-container">
    <div class="glass-card" style="text-align: center;">
        <h2>Welcome to Admin Dashboard 👑</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Overview of management operations.</p>
        
        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div style="background: rgba(16, 185, 129, 0.1); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(16, 185, 129, 0.2);">
                <h3 style="color: var(--success-hover); margin-bottom: 0.5rem; font-size: 1.1rem;">Net Profit (Total Margin)</h3>
                <div style="font-size: 2.5rem; font-weight: 800; color: var(--success-hover);">₹{{ total_profit }}</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
            <a href="/admin/add_product" class="btn btn-primary">➕ Add New Product</a>
            <a href="/admin/view_products_admin" class="btn btn-outline-nav">📦 View All Products</a>
            <a href="/admin/view_users" class="btn btn-outline-nav">👥 Manage Users</a>
            <a href="/admin/settings" class="btn btn-outline-nav">⚙️ Shop Settings</a>
        </div>
    </div>
</div>
{% endblock %}
