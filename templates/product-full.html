{% extends 'base.html' %}

{% block title %}{{ product[1] }} - E-Shop{% endblock %}

{% block content %}
<div class="fade-in">
    <a href="javascript:history.back()" class="btn btn-outline-nav" style="margin-top: 1rem;">← Back</a>
    
    <div class="product-single-container">
        <div class="product-single-image">
            <img src="{{ url_for('static', filename='uploads/' + product[5]) }}" alt="{{ product[1] }}">
        </div>

        <div class="product-single-details">
            <h1>{{ product[1] }}</h1>
            <div class="product-price">₹{{ product[2] }}</div>
            
            <div class="product-stock" style="font-size: 1.1rem;">
                Available Stock: <strong>{{ product[3] }}</strong>
            </div>

            <div class="product-desc">
                <strong>Description:</strong><br>
                {{ product[4] }}
            </div>

            <div class="product-actions" style="margin-top: 2rem;">
                <a href="/user/add_to_cart/{{ product[0] }}" class="btn btn-primary btn-block">🛒 Add to Cart</a>
                <a href="/user/buy_product/{{ product[0] }}" class="btn btn-success btn-block">⚡ Buy Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
