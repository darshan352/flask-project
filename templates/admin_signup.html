<!DOCTYPE html>
<html>
<head>
    <title>Admin SignUp</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* background: linear-gradient(to right, #4facfe, #00f2fe); */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 25px 5px rgba(0, 0, 0, 0.139);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #4facfe;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .login-btn:hover {
            background: #00c6ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Sign Up</h2>
        
        <form action="/admin/add_admin" method="post">
            <div class="input-box">
                <input type="text" name="admin_name" id="" placeholder="Enter name" required><br><br>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Sign Up</button>
        </form>

        <div class="footer-text">
        </div>
    </div>

</body>
</html>
